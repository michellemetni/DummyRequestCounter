name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  # ---------------------
  # 1️⃣ Code Quality
  # ---------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install flake8 bandit

      - name: Run linting
        run: |
          flake8 . --count --max-complexity=10 --max-line-length=120 --statistics

      - name: Run security scan
        run: |
          bandit -r . -ll

  # ---------------------
  # 2️⃣ Testing
  # ---------------------
  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v

  # ---------------------
  # 3️⃣ Build and deploy 
  # ---------------------
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t dummyrequestcounter-web:latest .

      - name: Test Docker container
        run: |
          docker run -d -p 8000:8000 --name test_container dummyrequestcounter-web:latest
          sleep 5
          for i in {1..5}; do
            curl -f http://localhost:8000 && break
            echo "Waiting for container to be ready..."
            sleep 2
          done
          docker stop test_container
          docker rm test_container

      - name: Push Docker image
        run: |
          docker tag dummyrequestcounter-web:latest ${{ secrets.DOCKER_USERNAME }}/dummyrequestcounter-web:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/dummyrequestcounter-web:latest
